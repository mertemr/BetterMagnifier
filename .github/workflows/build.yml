name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: >-
          ${{ github.event_name == 'pull_request'
              && fromJSON('["Debug"]')
              || fromJSON('["Debug","Release"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build
        shell: pwsh
        run: >-
          msbuild .\BetterMagnifier.sln
          /restore
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /v:minimal
          /nologo

      - name: Check the version is consistent
        shell: pwsh
        run: .\tools\check-version.ps1 -Configuration ${{ matrix.configuration }}

      - name: Self-check
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          .\bin\Debug-x64\BetterMagnifier.exe --self-check
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::self-check failed with exit $LASTEXITCODE"
              Get-ChildItem .\bin\Debug-x64\logs\*.log -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime | Select-Object -Last 1 |
                  Get-Content | Select-String 'SELF-CHECK FAILED|FATAL'
              exit 1
          }
          Write-Host "self-check passed"

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BetterMagnifier-${{ matrix.configuration }}-x64
          path: bin/${{ matrix.configuration }}-x64/
          if-no-files-found: error
          retention-days: 14
